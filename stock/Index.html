<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Finder</title>
<style>
:root{
  --bg:#f5f5f2;--card:#fff;--ink:#1b1b1a;--muted:#6b6b66;--line:#e2e1dc;
  --accent:#c8102e;--accent-ink:#fff;--ok:#1f7a4d;--ok-bg:#e3f3ea;--warn:#a85a00;--warn-bg:#fdf0dc;
  --bad:#b3261e;--bad-bg:#fbe5e3;--zero:#b9b8b2;--chip:#efeee9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211;--card:#1d1d1b;--ink:#efeee9;--muted:#9c9b95;--line:#33332f;
  --accent:#ff4d5e;--accent-ink:#fff;--ok:#5fd39a;--ok-bg:#16301f;--warn:#f0b35a;--warn-bg:#352711;
  --bad:#ff8a80;--bad-bg:#3a1714;--zero:#55544f;--chip:#2a2a27;}}
:root[data-theme="dark"]{
  --bg:#121211;--card:#1d1d1b;--ink:#efeee9;--muted:#9c9b95;--line:#33332f;
  --accent:#ff4d5e;--accent-ink:#fff;--ok:#5fd39a;--ok-bg:#16301f;--warn:#f0b35a;--warn-bg:#352711;
  --bad:#ff8a80;--bad-bg:#3a1714;--zero:#55544f;--chip:#2a2a27;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}
header .who{font-size:13px;color:var(--muted);text-align:right}
main{padding:12px 16px 96px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 2px 12px;font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.small{padding:7px 10px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.muted{color:var(--muted);font-size:13px}
.sku{font-weight:700;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.has{background:var(--ok-bg);color:var(--ok)}
.chip.zero{color:var(--zero)}
.chip.neg{background:var(--bad-bg);color:var(--bad)}
.chip.me{outline:2px solid var(--accent)}
.code{display:inline-block;font-weight:800;letter-spacing:1px;color:var(--ink);background:var(--chip);border-radius:6px;padding:0 6px;margin-left:4px}
.rsp{font-weight:800;margin-top:2px}
.dot{display:inline-block;font-size:1.35em;line-height:0;vertical-align:-0.08em;margin:0 .32em;color:var(--accent)}
.brands{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.brands button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.brands button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0}
.pager button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:700}
.pager button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pager button:disabled{opacity:.4}
.coming{font-weight:600;color:var(--warn)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;margin-left:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px}
.tag.new{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.item{display:flex;gap:12px;cursor:pointer}
.thumb{width:64px;height:48px;border-radius:8px;background:var(--chip);object-fit:cover;flex:none}
.total{font-size:22px;font-weight:800;text-align:right;min-width:44px}
.total small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.cardlink{display:block;margin-top:8px;font-size:13px;padding:5px 10px;text-decoration:none;text-align:center}
a.btn{text-decoration:none}
.sugg{position:relative}
.sugg .list{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:4;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.sugg .list div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg .list div:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800}
.qty input{width:52px;text-align:center;padding:7px 4px}
.newfields{display:grid;grid-template-columns:1.3fr 1fr .7fr;gap:6px;margin-top:6px}
.newfields input{padding:7px 8px;font-size:14px}
.newfields .upc{grid-column:1/-1}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:0 6px}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet img.big{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--chip)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
h2{font-size:17px;margin:16px 0 4px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Stock Finder</h1>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="app"><p class="muted"><span class="spin"></span> Loading stock…</p></main>
<nav id="nav" hidden>
  <button data-tab="find"><span>🔍</span>Find</button>
  <button data-tab="sold"><span>🧾</span>Sold today</button>
  <button data-tab="recv"><span>📦</span>Receive</button>
  <button data-tab="xfer"><span>🔁</span>Transfer</button>
  <button data-tab="more"><span>⚙️</span>More</button>
</nav>
<div id="sheet"></div>

<script>
/* Watchdog: a separate script, so it still runs if the main script fails. Shows the error on screen. */
window.SF_VERSION = '2026-11-12e';
window.SF_ERRORS = [];
window.addEventListener('error', function (e) {
  window.SF_ERRORS.push((e.message || 'Error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
});
setTimeout(function () {
  var app = document.getElementById('app');
  if (!app || app.textContent.indexOf('Loading stock') < 0) return;
  app.innerHTML = '<div class="msg err"><b>The page did not start.</b><br>' +
    (window.SF_STARTED ? 'Started, but waiting for the server.' : 'The main script did not run.') + '<br>' +
    (window.SF_ERRORS.length ? 'Error: ' + window.SF_ERRORS.join(' | ').replace(/</g, '&lt;') : 'No error reported.') +
    '<br>Page version ' + window.SF_VERSION + ' · lines in page: ' + document.documentElement.outerHTML.split('\n').length + '</div>';
}, 15000);
</script>
<script>
window.SF_STARTED = true;
/* ============ shared helpers (same rules as Code.gs) ============ */
const BRAND_PREFIX = {RB:'Ray-Ban', RX:'Ray-Ban', RJ:'Ray-Ban', RY:'Ray-Ban', RW:'Ray-Ban', OO:'Oakley', OX:'Oakley', OJ:'Oakley', OY:'Oakley', OW:'Oakley'};
const normModel = s => String(s||'').toUpperCase().replace(/\s+/g,'').replace(/^[0O](?=R[BXJYW]?\d|R[BXJY]R?\d)/,'').replace(/^0(?=O[OXJYW]\d)/,'').replace(/^R(?=\d)/,'RB');
const normColour = s => String(s||'').toUpperCase().replace(/\s+/g,'');
const normSize = s => (String(s||'').match(/\d{2,3}/)||[''])[0];
const normUpc = s => String(s||'').replace(/\D/g,'');
const skuKey = (m,c,z) => [normModel(m), normColour(c), normSize(z)].filter(Boolean).join(' ');
const brandOf = m => BRAND_PREFIX[normModel(m).slice(0,2)] || '';

/** Finds a frame code like 0RB2140 901 50-22 in a piece of text. */
const CODE_RE = /(?:^|[^A-Z0-9])[0O]?(R[BXJYW]\d{4}|O[OXJYW]\d{4}[A-Z]{0,2})(?![A-Z0-9])(?:[ \t\-_\/]+([A-Z0-9]{1,6}(?:\/[A-Z0-9]{1,4})?))?(?:[ \t\-_\/]+(\d{2})(?!\d))?/g;
function fixOcr(s){
  s = String(s||'').toUpperCase();
  // common OCR slips inside a model code: R8 -> RB, letters read in place of digits, space after prefix
  return s.replace(/(^|[^A-Z0-9])(0?)R([B8XJY])\s?([0-9OILSZ]{4})(?=[A-Z]{0,2}(?![A-Z0-9]))/g,
    (m,pre,z,b,d) => pre + z + 'R' + (b==='8'?'B':b) + d.replace(/O/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/Z/g,'2'));
}
function parseCodes(text){
  const s = fixOcr(text), out = [];
  CODE_RE.lastIndex = 0;
  let m;
  while ((m = CODE_RE.exec(s))){
    out.push({model:m[1], colour:/^[0-9O]+$/.test(m[2]||'') ? m[2].replace(/O/g,'0') : (m[2]||''), size:m[3]||'', raw:m[0].trim()});
  }
  return out;
}
function guessQty(line, raw){
  let s = fixOcr(line).replace(raw,' ')
    .replace(/\b\d{8,14}\b/g,' ')                         // barcodes / long numbers
    .replace(/\d[\d,]*[.,]\d{2}\b/g,' ')                   // prices
    .replace(/\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/g,' ') // dates
    .replace(/\b\d{2}\s*[-□xX]\s*\d{2}(\s*[-□xX]\s*\d{3})?\b/g,' '); // 50-22-145
  const near = s.match(/(\d{1,3})\s*(?:PCS?|PC|UNITS?|EA|NOS?)\b/) || s.match(/QTY\D{0,3}(\d{1,3})/);
  if (near) return +near[1];
  const nums = (s.match(/\b\d{1,2}\b/g)||[]).map(Number).filter(n => n>=1 && n<=30);
  return nums.length ? nums[nums.length-1] : 1;
}
/** Turns OCR text of a delivery order into stock lines. Staff review everything after. */
function parseDO(text){
  const lines = [];
  String(text||'').split(/\r?\n/).forEach(line => {
    const codes = parseCodes(line);
    const upcs = line.match(/\b\d{12,13}\b/g) || [];
    if (codes.length){
      codes.forEach(c => lines.push({model:normModel(c.model), colour:normColour(c.colour), size:normSize(c.size),
        upc: codes.length===1 && upcs.length===1 ? upcs[0] : '', qty: codes.length===1 ? guessQty(line, c.raw) : 1}));
    } else if (upcs.length){
      upcs.forEach(u => lines.push({upc:u, qty:1, upcOnly:true}));
    }
  });
  return lines;
}
if (typeof module !== 'undefined') module.exports = {parseCodes, parseDO, guessQty, normModel, skuKey};

/* ============ app ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
// Filled in by Code.gs when served from Google; the fixed link is used when the page is hosted on GitHub Pages.
const SERVED_URL = '__API_URL__';
const API_URL = SERVED_URL.indexOf('__') === 0
  ? 'https://script.google.com/macros/s/AKfycbwN55IGpSu_n-TXKvb5XsClwWh5jaTl3LJWrQ103td2D5TTbe0qOuJd4dFMIH-NRdSt/exec'
  : SERVED_URL;
async function call(fn, ...args){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
  let r;
  try {
    r = await fetch(API_URL, {method:'POST', body: JSON.stringify({fn, args}), signal: ctl.signal,
      headers: {'Content-Type':'text/plain;charset=utf-8'}, redirect: 'follow'});
  } catch(e){
    throw new Error(e.name==='AbortError' ? 'No reply from the server after 60 seconds.' : 'No connection to the server. Check the internet and try again.');
  } finally { clearTimeout(t); }
  let j;
  try { j = await r.json(); } catch(e){ throw new Error('Unexpected reply from the server (' + r.status + ').'); }
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j.result;
}
const S = {
  data:null, bySku:{}, byUpc:{}, tab:'find', q:'', onlyStock:false, brand:'', branch:'', page:1,
  auth: store.get('sf_auth2', null), shop: store.get('sf_shop', ''),
  lines: { sold: store.get('sf_sold', []), recv: store.get('sf_recv', []), xfer: store.get('sf_xfer', []) },
  ref: '', toShop: '', note: '', ocrText: '', msg: {}, busy: false, imp: null
};
const saveLines = k => store.set('sf_' + k, S.lines[k]);

async function loadData(){
  const d = await call('api_getData', S.auth);
  S.data = d; S.bySku = {}; S.byUpc = {};
  Object.assign(S.auth, d.user); store.set('sf_auth2', S.auth);
  if (!isAdmin() || !d.shops.some(x => x.code===S.shop)) S.shop = d.user.shop || (d.shops[0]||{}).code;
  store.set('sf_shop', S.shop);
  d.items.forEach(it => {
    it.total = Object.values(it.qty).reduce((a,b) => a+b, 0);
    it._h = (it.sku+' '+it.model.replace(/^R[A-Z]/,'')+' '+it.upc+' '+it.desc+' '+it.brand).toUpperCase();
    it._c = it._h.replace(/\s+/g,'');
    S.bySku[it.sku] = it; if (normUpc(it.upc)) S.byUpc[normUpc(it.upc)] = it;
  });
}
const shopName = c => ((S.data.shops.find(s => s.code===c)||{}).name) || c;
const shortName = c => shopName(c).replace(/\s*\(.*\)\s*$/, '');
const isAdmin = () => !!(S.auth && S.auth.role==='Admin');
/** Transfers grouped into requests: {id, from, to, status, requested, by, note, approvedBy, receivedBy, lines:[{sku,qty}]} */
function transferGroups(){
  const g = {};
  (S.data.transfers||[]).forEach(t => {
    const x = g[t.id] || (g[t.id] = Object.assign({}, t, {lines:[]}));
    x.lines.push({sku:t.sku, qty:t.qty});
  });
  return Object.values(g).sort((a,b) => b.id.localeCompare(a.id));
}
function xferTodo(){
  return transferGroups().filter(g => (isAdmin() && g.status==='PENDING') || (g.status==='IN TRANSIT' && g.to===S.shop)).length;
}

function search(q, limit){
  const toks = String(q||'').toUpperCase().split(/\s+/).filter(Boolean)
    .map(t => t.replace(/^[0O](?=R[A-Z]?\d|R[A-Z]R?\d)/,'').replace(/^0(?=O[A-Z]\d)/,'').replace(/^(\d{2})[-xX□]\d{2}$/,'$1'));
  let res = S.data.items;
  if (toks.length) res = res.filter(it => toks.every(t => it._h.includes(t) || it._c.includes(t)));
  if (S.onlyStock) res = res.filter(it => it.total > 0);
  if (S.brand && limit==null) res = res.filter(it => it.brand === S.brand);
  if (S.branch && limit==null) res = res.filter(it => (it.qty[S.branch]||0) !== 0 || (it.transit && it.transit[S.branch]));
  const me = S.shop;
  if (S.branch && limit==null) return res.slice().sort((a,b) => (b.qty[S.branch]>0)-(a.qty[S.branch]>0) || a.sku.localeCompare(b.sku));
  res = res.slice().sort((a,b) => (b.total>0)-(a.total>0) || (me ? (b.qty[me]>0)-(a.qty[me]>0) : 0) || a.sku.localeCompare(b.sku));
  return limit ? res.slice(0, limit) : res;
}

/* ---------- rendering ---------- */
function chips(it){
  const me = S.shop;
  return '<div class="chips">' + S.data.shops.map(s => {
    const n = it ? (it.qty[s.code]||0) : 0, tr = it && it.transit ? (it.transit[s.code]||0) : 0;
    return `<span class="chip ${n>0?'has':n<0?'neg':'zero'} ${s.code===me?'me':''}">${esc(s.name)} ${n}${tr ? ` <span class="coming">+${tr} coming</span>` : ''}</span>`;
  }).join('') + '</div>';
}
/** Exact ray-ban.com page from the Sheet's Link column, otherwise a Google search on ray-ban.com for the exact code. */
function productLink(it){
  if (/^https?:\/\//i.test(it.link || '')) return it.link;
  const code = [it.model, it.colour].filter(Boolean).join(' ');
  const q = it.brand==='Oakley' ? code : 'site:ray-ban.com "' + code + '"';
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}
/** Code with a big dot between model, colour and size: RB2140F • 901S • 52 */
const dotSku = sku => String(sku||'').split(' ').filter(Boolean).map(esc).join('<span class="dot">•</span>');
const rspTxt = it => it.rsp ? 'RSP RM' + Number(it.rsp).toLocaleString('en-MY') : '';
const linkBtn = (it, cls) => `<a class="btn alt small ${cls||''}" data-act="link" href="${esc(productLink(it))}" target="_blank" rel="noopener">Link</a>`;
function itemCard(it){
  return `<div class="card item" data-open="${esc(it.sku)}">
    ${it.photo ? `<img class="thumb" loading="lazy" src="${esc(it.photo)}" alt="">` : ''}
    <div class="grow"><div class="sku">${dotSku(it.sku)}</div>
      <div class="muted">${esc([it.brand, it.desc].filter(Boolean).join(' · '))}${it.cost ? ` <span class="code">${esc(it.cost)}</span>` : ''}</div>
      ${it.rsp ? `<div class="rsp">${esc(rspTxt(it))}</div>` : ''}${chips(it)}</div>
    <div class="total">${S.branch ? (it.qty[S.branch]||0) : it.total}<small>${S.branch ? esc(shortName(S.branch)) : 'total'}</small>${linkBtn(it, 'cardlink')}</div></div>`;
}
function msg(k){ const m = S.msg[k]; return m ? `<div class="msg ${m.t}">${esc(m.s)}</div>` : ''; }

function render(){
  const app = $('#app');
  $('#who').innerHTML = S.auth && S.data ? `${esc(S.auth.name)}${isAdmin()?' (Admin)':''}<br><span>${esc(shopName(S.shop))}</span>` : '';
  if (!S.auth || !S.data){ $('#nav').hidden = true; app.innerHTML = loginView(); return; }
  $('#nav').hidden = false;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===S.tab));
  const todo = xferTodo(), xb = document.querySelector('nav [data-tab=xfer]');
  xb.innerHTML = `<span>🔁</span>Transfer${todo ? `<i class="badge">${todo}</i>` : ''}`;
  app.innerHTML = ({find:findView, sold:soldView, recv:recvView, xfer:xferView, more:moreView})[S.tab]();
  if (S.tab==='find') renderResults();
}

function loginView(){
  return `<div class="card"><h2>Log in</h2>
    <label>User ID</label><input id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label>Password</label><input id="lgPass" type="password" autocomplete="current-password">
    ${msg('login')}<p><button class="btn wide" data-act="login" ${S.busy?'disabled':''}>${S.busy?'Logging in…':'Log in'}</button></p>
    <p class="muted">Each staff member has their own User ID. Every login, sale, delivery and transfer is recorded under your name.</p></div>`;
}

/** Prev · 1 … 4 5 [6] 7 8 … 12 · Next */
function pagerHtml(pages){
  const p = S.page, nums = new Set([1, pages, p-2, p-1, p, p+1, p+2].filter(n => n>=1 && n<=pages));
  let out = `<button data-act="pg" data-p="${p-1}" ${p===1?'disabled':''} aria-label="Previous page">‹</button>`, last = 0;
  [...nums].sort((a,b) => a-b).forEach(n => {
    if (n - last > 1) out += '<span class="muted">…</span>';
    out += `<button data-act="pg" data-p="${n}" class="${n===p?'on':''}">${n}</button>`; last = n;
  });
  return `<div class="pager">${out}<button data-act="pg" data-p="${p+1}" ${p===pages?'disabled':''} aria-label="Next page">›</button></div>`;
}

/* ---------- import (POS export) ---------- */
const FIELDS = [['code','Full code (e.g. RB2140 901 50)'],['model','Model'],['colour','Colour'],['size','Size'],['upc','UPC / barcode'],['desc','Description'],['brand','Brand'],['qty','Quantity on hand']];
const GUESS = {code:/(item|product|article|sku|stock)\s*(code|no)|^code$|^sku$/i, model:/model|style/i, colour:/col(ou)?r/i, size:/size|lens/i,
  upc:/upc|ean|bar\s*code/i, desc:/desc|name/i, brand:/brand|supplier|make/i, qty:/qty|quantity|on\s*hand|balance|stock|soh/i};
function importMapView(){
  const imp = S.imp, head = imp.rows[imp.headRow] || [];
  const opts = sel => '<option value="">—</option>' + head.map((h, i) => `<option value="${i}" ${String(sel)===String(i)?'selected':''}>${esc(h||('Column '+(i+1)))}</option>`).join('');
  const parsed = importParse();
  return `<p class="muted">Match the file's columns. Use either <b>Full code</b> or Model + Colour + Size.</p>
    <label>Header row</label><input id="impHead" type="number" min="1" value="${imp.headRow+1}">
    ${FIELDS.map(([f, l]) => `<label>${l}</label><select data-map="${f}">${opts(imp.map[f])}</select>`).join('')}
    <label class="row" style="color:var(--ink)"><input type="checkbox" id="impSF" ${imp.sizeFirst?'checked':''} style="width:auto"> Full code has size before colour (e.g. ORB2140F 52 901)</label>
    <label class="row" style="color:var(--ink)"><input type="checkbox" id="impRB" ${imp.rbOnly?'checked':''} style="width:auto"> Ray-Ban &amp; Oakley only (skip other brands)</label>
    <p class="muted">${imp.rows.length - imp.headRow - 1} rows in file → <b>${parsed.lines.length} SKUs, ${parsed.units} frames</b> to load.
      ${parsed.skipped ? parsed.skipped + ' rows skipped (no code found, other brand or qty 0).' : ''}</p>
    <div class="scroll"><table><tr><th>SKU</th><th>UPC</th><th>Qty</th></tr>
      ${parsed.lines.slice(0, 12).map(l => `<tr><td>${esc(skuKey(l.model,l.colour,l.size))}</td><td>${esc(l.upc)}</td><td>${l.qty}</td></tr>`).join('')}</table></div>
    <p><button class="btn wide" data-act="doImport" ${S.busy||!parsed.lines.length?'disabled':''}>Replace ${esc(shopName($('#impShop') ? $('#impShop').value : imp.shop))} stock with this file</button></p>`;
}
function importParse(){
  const imp = S.imp, m = imp.map, out = {}, res = {lines:[], units:0, skipped:0};
  const get = (r, f) => m[f]==='' || m[f]==null ? '' : String(r[m[f]]==null ? '' : r[m[f]]).trim();
  imp.rows.slice(imp.headRow + 1).forEach(r => {
    let model = get(r,'model'), colour = get(r,'colour'), size = get(r,'size');
    const code = get(r,'code');
    if (code && imp.sizeFirst){ // e.g. "RB ORB2140F 52 901-S": model, size, colour
      const t = code.toUpperCase().replace(/^[A-Z]{2,4}\s+(?=[0O]?R)/,'').split(/\s+/);
      model = model || t[0]; const two = /^\d{2}$/.test(t[1]||'');
      size = size || (two ? t[1] : ''); colour = colour || (two ? t[2] : t[1]) || '';
      colour = colour.replace(/-/g,'');
    } else if (code){ const c = parseCodes(code)[0]; if (c){ model = c.model; colour = colour || c.colour; size = size || c.size; } else if (!model) model = code; }
    model = normModel(model);
    const qty = Math.round(parseFloat(get(r,'qty')) || 0);
    const isRB = brandOf(model) || /RAY|OAK|^RB\.?$/i.test(get(r,'brand'));
    if (!model || qty <= 0 || (imp.rbOnly && !isRB)){ res.skipped++; return; }
    const key = skuKey(model, colour, size);
    const l = out[key] || (out[key] = {model, colour:normColour(colour), size:normSize(size), upc:normUpc(get(r,'upc')), desc:get(r,'desc'), qty:0});
    l.qty += qty;
  });
  res.lines = Object.values(out); res.units = res.lines.reduce((a, l) => a + l.qty, 0);
  return res;
}
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function readImportFile(file){
  if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
  let headRow = rows.findIndex(r => r.filter(c => String(c).trim()).length >= 3); if (headRow < 0) headRow = 0;
  const saved = store.get('sf_map_' + $('#impShop').value, null);
  const map = {};
  FIELDS.forEach(([f]) => { const i = (rows[headRow]||[]).findIndex(h => GUESS[f].test(String(h))); map[f] = i < 0 ? '' : i; });
  if (map.code !== '' && map.code === map.model) map.model = '';
  S.imp = {shop:$('#impShop').value, file:file.name, rows, headRow:saved ? saved.headRow : headRow, map:saved ? saved.map : map, rbOnly:true};
}

const fileB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
async function imageB64(f, max, q){
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q).split(',')[1];
}

function addLine(k, it, qty){
  const L = S.lines[k];
  const ex = L.find(l => l.sku && l.sku === it.sku);
  if (ex) ex.qty += qty || 1; else L.unshift({sku:it.sku, qty:qty || 1});
  saveLines(k);

function linesForServer(k){
  return S.lines[k].map(l => l.sku && S.bySku[l.sku] ? {sku:l.sku, qty:+l.qty}
    : {model:l.model, colour:l.colour, size:l.size, upc:l.upc, desc:l.desc, qty:+l.qty});
}
function badNewLines(k){ return S.lines[k].filter(l => !(l.sku && S.bySku[l.sku]) && !normModel(l.model)).length; }

async function submit(k, fn, args, okText){
  const bad = badNewLines(k);
  if (bad){ S.msg[k] = {t:'err', s:`${bad} new item line(s) need at least a model, e.g. RB2140.`}; return render(); }
  S.busy = true; S.msg[k] = null; render();
  try {
    const r = await call(fn, ...args);
    S.lines[k] = []; saveLines(k); S.note = ''; if (k==='recv') { S.ref = ''; S.ocrText = ''; }
    await loadData();
    S.msg[k] = {t:'ok', s:okText(r)};
  } catch(e){ S.msg[k] = {t:'err', s:'Not saved: ' + e.message}; }
  S.busy = false; render();
}

  const a = t.dataset.act, k = t.dataset.k, i = +t.dataset.i;

  if (a==='branch'){ S.branch = t.dataset.c; S.page = 1; render(); return; }
  if (a==='pg'){ S.page = +t.dataset.p; renderResults(); $('#q').scrollIntoView({block:'start'}); window.scrollBy(0, -70); return; }
  if (a==='close'){ if (e.target===t || t.classList.contains('x')) $('#sheet').innerHTML = ''; return; }
  if (a==='login'){
    const user = $('#lgUser').value.trim(), pass = $('#lgPass').value;
    if (!user || !pass){ S.msg.login = {t:'err', s:'Enter your User ID and password.'}; return render(); }
    S.busy = true; S.msg.login = null; render();
    try {
      const r = await call('api_login', user, pass, navigator.userAgent);
      S.auth = Object.assign({user, pass}, r); S.shop = r.shop; S.tab = 'find';
      await loadData();
    } catch(err){ S.auth = null; S.data = null; S.msg.login = {t:'err', s:err.message}; }
    store.set('sf_auth2', S.auth); S.busy = false; render(); return;
  }
  if (a==='logout'){ S.auth = null; S.data = null; S.imp = null; store.set('sf_auth2', null); store.set('sf_shop', ''); render(); return; }
  if (['approve','reject','received','cancelX'].includes(a)){
    const id = t.dataset.id;
    const ask = {approve:'Approve transfer ' + id + '? The frames come off the sending shop now.', reject:'Reject transfer ' + id + '?',
      received:'Confirm the frames in ' + id + ' have arrived? They will be added to the receiving shop.', cancelX:'Cancel request ' + id + '?'}[a];
    if (!confirm(ask)) return;
    S.busy = true; render();
    try {
      if (a==='approve' || a==='reject') await call('api_decideTransfer', S.auth, id, a==='approve');
      if (a==='received') await call('api_receiveTransfer', S.auth, id);
      if (a==='cancelX') await call('api_cancelTransfer', S.auth, id);
      await loadData();
      S.msg.xferAct = {t:'ok', s:{approve:'Approved: ' + id + ' is now in transit.', reject:'Rejected ' + id + '.', received:'Received: stock added.', cancelX:'Request cancelled.'}[a]};
    } catch(err){ S.msg.xferAct = {t:'err', s:err.message}; }
    S.busy = false; render(); window.scrollTo(0, 0); return;
  }
  if (a==='refresh'){ t.disabled = true; await loadData(); render(); return; }
  if (a==='inc'){ S.lines[k][i].qty = (+S.lines[k][i].qty||0) + 1; saveLines(k); render(); return; }
  if (a==='dec'){ S.lines[k][i].qty = Math.max(1, (+S.lines[k][i].qty||1) - 1); saveLines(k); render(); return; }
  if (a==='del'){ S.lines[k].splice(i, 1); saveLines(k); render(); return; }
  if (a==='addnew'){ S.lines[k].unshift({model:'', colour:'', size:'', upc:'', qty:1}); saveLines(k); render(); return; }
  if (a==='toSold' || a==='toXfer'){ const kk = a==='toSold' ? 'sold' : 'xfer'; addLine(kk, S.bySku[t.dataset.sku], 1); $('#sheet').innerHTML = ''; S.tab = kk; render(); return; }
  if (a==='saveSold'){
    const n = S.lines.sold.reduce((x, l) => x + (+l.qty||0), 0);
    if (!confirm(`Deduct ${n} frame(s) sold today from ${shopName(S.shop)}?`)) return;
    return submit('sold', 'api_recordSales', [S.auth, linesForServer('sold'), S.note, S.shop], r => `Saved ${r.saved} line(s). Stock updated.`);
  }
  if (a==='saveRecv'){
    if (!confirm(`Add these frames to ${shopName(S.shop)} stock?`)) return;
    return submit('recv', 'api_receive', [S.auth, linesForServer('recv'), S.ref, S.shop], r => `Added ${r.saved} line(s) to stock.`);
  }
  if (a==='saveXfer'){
    if (!S.toShop){ S.msg.xfer = {t:'err', s:'Choose the shop you are sending to.'}; return render(); }
    if (!confirm(`Ask the owner to approve sending these frames from ${shopName(S.shop)} to ${shopName(S.toShop)}?`)) return;
    return submit('xfer', 'api_requestTransfer', [S.auth, S.toShop, linesForServer('xfer'), S.note, S.shop], r => `Request ${r.id} sent for approval (${r.lines} line(s)).`);
  }
  if (a==='ocr'){
    const files = [...($('#doFile').files||[])];
    if (!files.length){ S.msg.ocr = {t:'err', s:'Choose a photo or PDF of the DO first.'}; return render(); }
    S.busy = true; S.msg.ocr = {t:'warn', s:'Reading DO… this can take up to a minute.'}; render();
    try {
      const payload = [];
      for (const f of files) payload.push({name:f.name, mime: f.type==='application/pdf' ? f.type : 'image/jpeg',
        b64: f.type==='application/pdf' ? await fileB64(f) : await imageB64(f, 2400, 0.9)});
      const r = await call('api_ocr', S.auth, payload, S.shop);
      S.ocrText = r.text;
      const found = parseDO(r.text);
      let matched = 0, fresh = 0, unknownUpc = 0;
      found.forEach(l => {
        const key = skuKey(l.model, l.colour, l.size);
        const it = (l.upc && S.byUpc[normUpc(l.upc)]) || S.bySku[key];
        if (it){ addLine('recv', it, l.qty); matched++; }
        else if (l.upcOnly){ unknownUpc++; S.lines.recv.push({model:'', colour:'', size:'', upc:l.upc, qty:l.qty}); }
        else { fresh++; S.lines.recv.push({model:l.model, colour:l.colour, size:l.size, upc:l.upc, qty:l.qty}); }
      });
      saveLines('recv');
      S.msg.ocr = found.length ? {t:'warn', s:`Found ${found.length} line(s): ${matched} known, ${fresh} new item(s)${unknownUpc?`, ${unknownUpc} barcode(s) only`:''}. Check every quantity against the paper DO before saving.`}
        : {t:'err', s:'No frame codes found. Try a sharper, flatter photo, or add the items by hand.'};
    } catch(err){ S.msg.ocr = {t:'err', s:'Could not read DO: ' + err.message}; }
    S.busy = false; render(); return;
  }
  if (a==='showOcr'){ $('#sheet').innerHTML = `<div class="sheet" data-act="close"><div class="in"><div class="row" style="justify-content:space-between"><b>Scanned text</b><button class="x" data-act="close">×</button></div><textarea readonly style="min-height:60vh">${esc(S.ocrText)}</textarea></div></div>`; return; }
  if (a==='doImport'){
    const shop = $('#impShop').value, p = importParse();
    if (!confirm(`REPLACE all ${shopName(shop)} stock with ${p.units} frames (${p.lines.length} SKUs) from ${S.imp.file}?`)) return;
    store.set('sf_map_' + shop, {headRow:S.imp.headRow, map:S.imp.map});
    S.busy = true; render();
    try { const r = await call('api_importShop', S.auth, shop, p.lines, S.imp.file); await loadData(); S.imp = null; S.msg.imp = {t:'ok', s:`${shopName(shop)}: loaded ${r.saved} SKUs.`}; }
    catch(err){ S.msg.imp = {t:'err', s:'Import failed: ' + err.message}; }
    S.busy = false; render(); return;
  }
});

let suggTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id==='q'){ S.q = t.value; S.page = 1; renderResults(); return; }
  if (t.id==='add'){ clearTimeout(suggTimer); suggTimer = setTimeout(() => showSugg(t), 80); return; }
  if (t.dataset.f){
    const l = S.lines[t.dataset.k][+t.dataset.i];
    l[t.dataset.f] = t.dataset.f==='qty' ? Math.max(0, parseInt(t.value) || 0) : t.value;
    saveLines(t.dataset.k); return;
  }
  if (t.id==='ref') S.ref = t.value;
  if (t.id==='note') S.note = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id==='only'){ S.onlyStock = t.checked; S.page = 1; renderResults(); }
  if (t.id==='toShop') S.toShop = t.value;
  if (t.id==='actShop'){ S.shop = t.value; store.set('sf_shop', S.shop); render(); }
  if (t.id==='photo' && t.files[0]){
    $('#photoMsg').innerHTML = '<p class="muted"><span class="spin"></span> Uploading…</p>';
    try { await call('api_setPhoto', S.auth, t.dataset.sku, await imageB64(t.files[0], 1000, 0.82), 'image/jpeg'); await loadData(); openItem(t.dataset.sku); }
    catch(err){ $('#photoMsg').innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  }
  if (t.id==='impFile' && t.files[0]){
    try { await readImportFile(t.files[0]); S.msg.imp = null; } catch(err){ S.msg.imp = {t:'err', s:'Could not read file: ' + err.message}; }
    render();
  }
  if (t.id==='impShop' && S.imp){ S.imp.shop = t.value; $('#impMap').innerHTML = importMapView(); }
  if (t.dataset.map != null){ S.imp.map[t.dataset.map] = t.value; $('#impMap').innerHTML = importMapView(); }
  if (t.id==='impHead'){ S.imp.headRow = Math.max(0, (+t.value||1) - 1); $('#impMap').innerHTML = importMapView(); }
  if (t.id==='impSF'){ S.imp.sizeFirst = t.checked; $('#impMap').innerHTML = importMapView(); }
  if (t.id==='impRB'){ S.imp.rbOnly = t.checked; $('#impMap').innerHTML = importMapView(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id==='lgPass' && e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-act=login]').click(); return; }
  if (e.target.id!=='add' || e.key!=='Enter') return;
  e.preventDefault();
  const v = e.target.value.trim(), k = e.target.dataset.k;
  const u = normUpc(v), c = parseCodes(v)[0];
  const it = (u.length >= 8 && S.byUpc[u]) || (c && S.bySku[skuKey(c.model, c.colour, c.size)]);
  const res = it ? [it] : search(v, 2);
  if (res.length===1){ addLine(k, res[0], 1); render(); setTimeout(() => $('#add').focus(), 0); }
});
function showSugg(inp){
  const box = $('#sugg'), v = inp.value.trim();
  if (!v){ box.hidden = true; return; }
  const res = search(v, 8), me = S.shop;
  box.innerHTML = res.map(it => `<div data-pick="${esc(it.sku)}" data-k="${inp.dataset.k}"><b>${dotSku(it.sku)}</b>
    <span class="muted"> · here ${it.qty[me]||0} · total ${it.total}</span></div>`).join('') || '<div class="muted">No match. Use "+ Item not in list yet".</div>';
  box.hidden = false;
}

(async function start(){
  if (!S.auth){ render(); return; }
  try { await loadData(); }
  catch(e){
    if (/password|log in/i.test(e.message)){ S.auth = null; store.set('sf_auth2', null); S.msg.login = {t:'err', s:e.message}; render(); return; }
    $('#app').innerHTML = `<div class="msg err">Could not load stock: ${esc(e.message)}</div>
      <p><button class="btn" onclick="location.reload()">Try again</button></p>`;
    return;
  }
  render();
})();
</script>
</body>
